services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE debe configurarse en .env}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER debe configurarse en .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD debe configurarse en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD debe configurarse en .env}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_NAME: ${SMTP_NAME:-Control de Prácticas}
      SMTP_INSECURE: ${SMTP_INSECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_uploads:/app/uploads

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE debe configurarse en .env}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER debe configurarse en .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD debe configurarse en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD debe configurarse en .env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - ./database.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  app_uploads:
  db_data:
